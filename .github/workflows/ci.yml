name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo is public and the match data is not redistributable (RULES.md).
      - name: No match data or video is tracked
        run: |
          bad=$(git ls-files | grep -E '^data/|\.mp4$|_atd\.(txt|xml)$|_homography\.csv$|_smart_tagging\.xml$|_possession_gt\.csv$' | grep -v '^data/README\.md$' || true)
          if [ -n "$bad" ]; then
            echo "These files must never be committed:"
            echo "$bad"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Unit tests
        run: |
          if [ -d tests ]; then pytest -q tests; else echo "No tests yet"; fi

      # Format check only. CI never scores against the public ground truth (RULES.md: no tuning on it).
      - name: Validate the final submission, if committed
        run: |
          shopt -s nullglob
          files=$(git ls-files '*.csv' | grep -v -E '^(evaluation|experiments|outputs)/' || true)
          if [ -z "$files" ]; then echo "No submission CSV committed yet"; exit 0; fi
          for f in $files; do python evaluation/validate_submission.py "$f"; done
